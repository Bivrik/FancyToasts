# Mandatory
modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${license}"

# Optional
issueTrackerURL="${issue_tracker_url}"
clientSideOnly=true

[[mods]]
# Mandatory
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"

# Optional
displayURL = "${homepage_url}" # displays in the mod UI
logoFile = "icon.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}''' # supports multiline text

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required" # can be one of "required", "optional", "incompatible" or "discouraged"
versionRange = "[${neoforge_version},)"
ordering = "NONE" # the order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "CLIENT" # side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
