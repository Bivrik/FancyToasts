plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven {
        name = "Terraformers"
        url = uri("https://maven.terraformersmc.com")
    }
}

apply from: rootProject.file('gradle/scripts/conditional-dependencies.gradle')

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "com.terraformersmc:modmenu:${project.fabric_modmenu_version}"

    conditionalModImplementation "fabric_jade_version", "maven.modrinth:jade:${project.fabric_jade_version}"
    conditionalModImplementation "fabric_ftb_quests_version", "curse.maven:ftb-quests-fabric-438496:${project.fabric_ftb_quests_version}"
    conditionalModImplementation "fabric_ftb_library_version", "curse.maven:ftb-library-fabric-438495:${project.fabric_ftb_library_version}"
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}
