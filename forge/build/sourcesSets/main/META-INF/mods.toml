# Mandatory
modLoader = "javafml"
loaderVersion = "[57,)"
license = "MIT"

# Optional
issueTrackerURL="https://github.com/Bivrik/FancyToasts/issues"
clientSideOnly=true

[[mods]]
# Mandatory
modId = "fancytoasts"
version = "1.3.3"
displayName = "FancyToasts"

# Optional
displayURL = "https://github.com/Bivrik" # displays in the mod UI
logoFile = "banner.png"
credits = "My friends and everyone who downloaded so far! <3"
authors = "Bivrik"
description = '''Redesigns the old advancement toast system, replacing it with a more attractive and interesting one.''' # supports multiline text

[[dependencies."fancytoasts"]]
modId = "forge"
mandatory = true
versionRange = "[58.0.5,)"
ordering = "NONE" # the order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "CLIENT" # side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies."fancytoasts"]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.8, 1.22)"
ordering = "NONE"
side = "BOTH"
