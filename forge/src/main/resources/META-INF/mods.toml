# Mandatory
modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

# Optional
issueTrackerURL="${issue_tracker_url}"
clientSideOnly=true

[[mods]]
# Mandatory
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"

# Optional
displayURL = "${homepage_url}" # displays in the mod UI
logoFile = "banner.png"
credits = "${credits}"
authors = "${mod_author}"
description = '''${description}''' # supports multiline text

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE" # the order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "CLIENT" # side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

["badoptimizations:incompatibilities"]
options = [
    "enable_toast_optimizations"
]
