pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = 'https://maven.fabricmc.net/'
                }
            }
            filter {
                includeGroupAndSubgroups 'net.fabricmc'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForge'
                    url = 'https://maven.neoforged.net/releases/'
                }
            }
            filter {
                includeGroupAndSubgroups 'net.neoforged'
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'FancyToasts'
include 'common'
include 'fabric'
include 'neoforge'
